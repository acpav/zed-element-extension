name = "Xbsl"
grammar = "xbsl"
path_suffixes = ["xbsl"]
line_comments = ["//"]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 1 }
autoclose_before = ";)]}"

brackets = [
  { start = "{", end = "}", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]

# Bodies are indented via the @indent/@end captures in indents.scm.
# Branch keywords (иначе/поймать/когда) and the statement terminator `;`
# are dedented via the @start.* captures and these patterns.

decrease_indent_patterns = [
  { pattern = "^\\s*иначе\\s+если\\b", valid_after = ["if", "else"] },
  { pattern = "^\\s*иначе\\b", valid_after = ["if", "else", "select", "case"] },
  { pattern = "^\\s*поймать\\b", valid_after = ["try"] },
  { pattern = "^\\s*когда\\b", valid_after = ["case"] },
  { pattern = "^\\s*;\\s*$", valid_after = ["if", "else", "while", "for", "try", "catch", "select", "case", "method", "type"] },
]
